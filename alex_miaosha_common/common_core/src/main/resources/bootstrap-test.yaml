spring:
  cloud:
    nacos:
      server-addr: ${nacos.url}
      username: ${nacos.username}
      password: ${nacos.password}
      config:
        server-addr: ${nacos.url}
        username: ${nacos.username}
        password: ${nacos.password}
        file-extension: ${nacos.file-extension}
        group: ${nacos.group}
        namespace: ${nacos.namespace:${nacos.namaspace}}
        extension-configs:
          - data-id: ${nacos.redis}.${nacos.file-extension}
            group: ${nacos.group}
            refresh: true
          - data-id: ${nacos.nacos}.${nacos.file-extension}
            group: ${nacos.group}
            refresh: true
          - data-id: ${nacos.knife4j}.${nacos.file-extension}
            group: ${nacos.group}
            refresh: true
          - data-id: ${nacos.admin}.${nacos.file-extension}
            group: ${nacos.group}
            refresh: true
          - data-id: ${nacos.jasypt}.${nacos.file-extension}
            group: ${nacos.group}
            refresh: true
          - data-id: ${nacos.audience}.${nacos.file-extension}
            group: ${nacos.group}
            refresh: true
          - data-id: ${nacos.wechat}.${nacos.file-extension}
            group: ${nacos.group}
            refresh: true
          - data-id: ${nacos.xxl}.${nacos.file-extension}
            group: ${nacos.group}
            refresh: true
          - data-id: ${nacos.oss}.${nacos.file-extension}
            group: ${nacos.group}
            refresh: true
          - data-id: ${nacos.ai-config}.${nacos.file-extension}
            group: ${nacos.group}
            refresh: true
      discovery:
        server-addr: ${nacos.url}
        namespace: ${nacos.namespace:${nacos.namaspace}}
        group: ${nacos.group}
        username: ${nacos.username}
        password: ${nacos.password}

nacos:
  url: ${info.ip:10.10.20.238:8848}
  group: alex-miaosha-test
  namespace: ${nacos.namespace:alex-miaosha-test}
  namaspace: ${nacos.namespace}
  username: nacos
  password: nacos
  file-extension: yaml
  knife4j: knife4j
  admin: springbootadmin
  nacos: nacos-service
  redis: redis
  jasypt: jasypt-user
  audience: audience
  wechat: wechat
  xxl: xxl
  oss: oss
  ai-config: ai-config
