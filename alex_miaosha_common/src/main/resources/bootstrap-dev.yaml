  namaspace: 033377eb-973b-4dac-a0e9-e99c87325009
  username: nacos
  password: nacos
  file-extension: yaml
  knife4j: knife4j
  admin: springbootadmin
  nacos: nacos-service
  redis: redis
  jasypt: jasypt-user
  audience: audience
  wechat: wechat
