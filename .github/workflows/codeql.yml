name: "CodeQL Analysis"

on:
  push:
    branches: [ "main", "master" ] # 替换为你项目的主分支名
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '30 1 * * 1' # 每周一凌晨 1:30 自动全量扫描一次

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java' ] # 指定扫描 Java 语言

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 初始化 CodeQL 工具
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # 针对 Java 17 建议开启此项，有助于提高扫描精度
          queries: security-extended,security-and-quality

      # 设置 Java 环境（根据你项目使用的版本，这里选 17）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 编译项目
      # CodeQL 需要通过编译过程来理解代码逻辑。
      # 如果你的 Maven 命令有特殊参数（如 -P prod），请在此处修改
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 执行分析
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"